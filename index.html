<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ALERT</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: monospace;
            text-align: center;
            padding-top: 20%;
            margin: 0;
            overflow: hidden;
        }
        h1 { font-size: 2rem; }
        p { color: white; font-size: 1.2rem; }
        .popup-modal {
            display: none;
            position: fixed;
            background-color: #1a1a1a;
            border: 3px solid red;
            color: red;
            z-index: 10000;
            font-family: monospace;
            text-align: center;
            padding: 30px;
            min-width: 300px;
            box-shadow: 0 0 20px red;
            animation: fadeOut 0.5s ease-out forwards;
        }
        .popup-modal.show {
            display: block;
            animation: none;
        }
        .popup-modal.image-only {
            background-color: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            min-width: auto;
        }
        .popup-image {
            max-width: 280px;
            max-height: 250px;
            margin: 0;
        }
        .fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-in;
            overflow: hidden;
        }
        .fullscreen-video video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        .trap-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: red;
            color: black;
            padding: 10px 20px;
            border: 2px solid darkred;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            z-index: 9000;
            box-shadow: 0 0 10px red;
        }
        .trap-button:hover {
            background-color: darkred;
            color: red;
        }
        
        /* ニコニコ風 弾幕コメント用CSS */
        .danmaku-text {
            position: absolute;
            white-space: nowrap;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black, -2px -2px 4px black, 2px -2px 4px black, -2px 2px 4px black;
            z-index: 100000;
            will-change: transform;
            animation: flowText 5s linear forwards; /* 5秒かけてスーーッと通過 */
        }

        @keyframes flowText {
            from {
                transform: translateX(100vw);
            }
            to {
                transform: translateX(-100%);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .close-btn {
            background-color: red;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 30px;
            font-weight: bold;
        }
        .close-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <button class="trap-button" onclick="triggerTrap();">⚠️ システム保護を解除</button>
    
    <h1>システムエラーを検出</h1>
    <p>IP アドレスを取得中…</p>
    <p id="ip">IP: 検索中...</p>
    <p id="status">Status: ANALYZING...</p>

    <script>
        let dotCount = 0;
        let autoClickInterval = 2000;
        let minInterval = 200;
        let isMaxSpeed = false;
        let popupCount = 0;
        let maxSpeedStartTime = null;

        // 流すメッセージリスト（厳選してくれた最高ラインナップ）
        const comments = [
            "令和になってもこれに引っかかる奴おる？ｗｗ",
            "ドッキリ大成功～～～ｗｗ",
            "ばーかｗｗ",
            "草",
            "草ァ",
            "ｗ",
            "草草の草ｗ",
            "草に草を生やすな（大迫真）",
            "ウイルスなわけないやんｗｗ",
            "自作サイトでぇすｗｗ"
        ];

        function triggerTrap() {
            alert('⚠️ エラー: 保護機能の解除に失敗しました。\n緊急セキュリティプロセスを実行します。');
            showFullscreenVideo();
        }

        function getRandomPosition() {
            const modalWidth = Math.min(320, window.innerWidth * 0.8);
            const modalHeight = 300;
            
            const maxX = Math.max(10, window.innerWidth - modalWidth - 20);
            const maxY = Math.max(10, window.innerHeight - modalHeight - 20);
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            return { x: randomX, y: randomY };
        }

        function updateDots() {
            dotCount = (dotCount + 1) % 4;
            const dots = '.'.repeat(dotCount);
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = 'Status: TRANSMITTING' + dots;
            }
        }

        function shouldShowImage() {
            return Math.random() < 0.1;
        }

        function shouldShowFinalVideo() {
            if (!isMaxSpeed || !maxSpeedStartTime) return false;
            const elapsed = Date.now() - maxSpeedStartTime;
            return elapsed >= 5000;
        }

        // 被り防止：レーン分け管理変数
        let lastLane = -1;

        function createDanmaku(container) {
            const textEl = document.createElement('div');
            textEl.className = 'danmaku-text';
            textEl.textContent = comments[Math.floor(Math.random() * comments.length)];
            
            // 6つのレーン（高さ）から直前と重ならない場所を選ぶ
            const totalLanes = 6;
            let currentLane = Math.floor(Math.random() * totalLanes);
            while (currentLane === lastLane) {
                currentLane = Math.floor(Math.random() * totalLanes);
            }
            lastLane = currentLane;

            // 高さを10%〜80%の間にきれいに分散させる
            const topPos = 12 + (currentLane * 13);
            textEl.style.top = topPos + '%';

            // フォントサイズも少しランダム感を入れる
            const fontSize = (Math.random() * 0.8 + 1.8).toFixed(1);
            textEl.style.fontSize = fontSize + 'rem';

            container.appendChild(textEl);

            textEl.addEventListener('animationend', () => {
                textEl.remove();
            });
        }

        function showFullscreenVideo() {
            document.body.innerHTML = '';

            const videoContainer = document.createElement('div');
            videoContainer.className = 'fullscreen-video';
            videoContainer.innerHTML = `
                <video autoplay muted loop playsinline>
                    <source src="https://images-ext-1.discordapp.net/external/EMp5mmeA08U6ut65CL2qf0eWi-pG4TR23xTKDDgumrY/https/static.klipy.com/ii/d7aec6f6f171607374b2065c836f92f4/80/e5/cMSsfHQF3to9Rgl3.mp4" type="video/mp4">
                </video>
            `;
            document.body.appendChild(videoContainer);

            // 0.7秒間隔でレーンを変えて1文字ずつ流す（これで絶対被らない！）
            setInterval(() => {
                createDanmaku(videoContainer);
            }, 700);
        }

        function createPopup(shouldHaveImage = false) {
            let modal = document.createElement('div');
            
            if (shouldHaveImage) {
                modal.className = 'popup-modal show image-only';
                const pos = getRandomPosition();
                modal.style.left = pos.x + 'px';
                modal.style.top = pos.y + 'px';
                modal.innerHTML = `<img src="https://gifdb.com/images/thumbnail/you-are-an-idiot-smiley-dance-ne6fhseiw9s2mgo9.gif" class="popup-image" alt="image">`;
            } else {
                modal.className = 'popup-modal show';
                const pos = getRandomPosition();
                modal.style.left = pos.x + 'px';
                modal.style.top = pos.y + 'px';
                modal.innerHTML = `
                    <h1>⚠️ WARNING ⚠️</h1>
                    <p>IP アドレスを取得中…</p>
                    <p id="ip-modal">IP: 検索中...</p>
                    <p>コンテンツを転送中…</p>
                    <p id="status-modal">Status: TRANSMITTING</p>
                    <button class="close-btn" onclick="handleClose(this);">閉じる</button>
                `;
            }
            
            document.body.appendChild(modal);

            if (!shouldHaveImage) {
                let autoClickTimer = setTimeout(() => {
                    simulateClick(modal.querySelector('.close-btn'));
                }, autoClickInterval);

                modal.addEventListener('mouseenter', () => {
                    clearTimeout(autoClickTimer);
                });

                modal.addEventListener('mouseleave', () => {
                    autoClickTimer = setTimeout(() => {
                        simulateClick(modal.querySelector('.close-btn'));
                    }, autoClickInterval);
                });
            } else {
                setTimeout(() => {
                    modal.remove();
                }, autoClickInterval);
            }
        }

        function simulateClick(button) {
            if (button) {
                button.click();
            }
        }

        function handleClose(button) {
            const modal = button.parentElement;
            modal.classList.remove('show');
            setTimeout(() => {
                modal.remove();
                
                popupCount++;

                if (autoClickInterval <= minInterval) {
                    if (!isMaxSpeed) {
                        isMaxSpeed = true;
                        maxSpeedStartTime = Date.now();
                    }
                }

                if (shouldShowFinalVideo()) {
                    showFullscreenVideo();
                    return;
                }
                
                if (isMaxSpeed) {
                    createPopup(false);
                    setTimeout(() => {
                        createPopup(shouldShowImage());
                    }, 50);
                } else {
                    autoClickInterval = Math.max(minInterval, autoClickInterval - 300);
                    const hasImage = shouldShowImage();
                    createPopup(hasImage);
                }
            }, 500);
        }

        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 500]);
        }

        window.onload = () => {
            setTimeout(() => {
                const statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.style.display = 'block';
                    setInterval(updateDots, 500);
                }
            }, 2000);

            setTimeout(() => {
                createPopup(false);
            }, 500);
        };
    </script>
</body>
</html>
