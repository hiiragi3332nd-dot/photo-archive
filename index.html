<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ALERT</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: monospace;
            text-align: center;
            padding-top: 20%;
            margin: 0;
            overflow: hidden;
        }
        h1 { font-size: 2rem; }
        p { color: white; font-size: 1.2rem; }
        .popup-modal {
            display: none;
            position: fixed;
            background-color: #1a1a1a;
            border: 3px solid red;
            color: red;
            z-index: 10000;
            font-family: monospace;
            text-align: center;
            padding: 30px;
            min-width: 300px;
            box-shadow: 0 0 20px red;
            animation: fadeOut 0.5s ease-out forwards;
        }
        .popup-modal.show {
            display: block;
            animation: none;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .close-btn {
            background-color: red;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 30px;
            font-weight: bold;
        }
        .close-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <h1>システムエラーを検出</h1>
    <p>IP アドレスを取得中…</p>
    <p id="ip">IP: 検索中...</p>
    <p id="status">Status: ANALYZING...</p>

    <script>
        let dotCount = 0;
        let autoClickInterval = 3000;
        let minInterval = 200;

        function getRandomPosition() {
            const maxX = window.innerWidth - 350;
            const maxY = window.innerHeight - 300;
            const randomX = Math.max(0, Math.random() * maxX);
            const randomY = Math.max(0, Math.random() * maxY);
            return { x: randomX, y: randomY };
        }

        function updateDots() {
            dotCount = (dotCount + 1) % 4;
            const dots = '.'.repeat(dotCount);
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = 'Status: TRANSMITTING' + dots;
            }
        }

        function createPopup() {
            let modal = document.createElement('div');
            modal.className = 'popup-modal show';
            
            const pos = getRandomPosition();
            modal.style.left = pos.x + 'px';
            modal.style.top = pos.y + 'px';
            
            modal.innerHTML = `
                <h1>⚠️ WARNING ⚠️</h1>
                <p>IP アドレスを取得中…</p>
                <p id="ip-modal">IP: 検索中...</p>
                <p>コンテンツを転送中…</p>
                <p id="status-modal">Status: TRANSMITTING</p>
                <button class="close-btn" onclick="handleClose(this);">閉じる</button>
            `;
            document.body.appendChild(modal);

            // 自動クリック機能
            let autoClickTimer = setTimeout(() => {
                simulateClick(modal.querySelector('.close-btn'));
            }, autoClickInterval);

            // マウスホバーで自動クリックをキャンセル
            modal.addEventListener('mouseenter', () => {
                clearTimeout(autoClickTimer);
            });

            modal.addEventListener('mouseleave', () => {
                autoClickTimer = setTimeout(() => {
                    simulateClick(modal.querySelector('.close-btn'));
                }, autoClickInterval);
            });
        }

        function simulateClick(button) {
            if (button) {
                button.click();
            }
        }

        function handleClose(button) {
            const modal = button.parentElement;
            // フェードアウト効果
            modal.classList.remove('show');
            setTimeout(() => {
                modal.remove();
                // 自動クリック間隔を短縮
                autoClickInterval = Math.max(minInterval, autoClickInterval - 500);
                createPopup();
            }, 500);
        }

        // バイブ機能
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 500]);
        }

        // ページ読み込み後、自動でポップアップ生成
        window.onload = () => {
            // 数秒後にステータス表示
            setTimeout(() => {
                const statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.style.display = 'block';
                    // ドット更新を開始
                    setInterval(updateDots, 500);
                }
            }, 2000);

            // ポップアップを表示
            setTimeout(() => {
                createPopup();
            }, 500);
        };
    </script>
</body>
</html>
