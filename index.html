<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ALERT</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: monospace;
            text-align: center;
            padding-top: 20%;
            margin: 0;
            overflow: hidden;
        }
        h1 { font-size: 2rem; }
        p { color: white; font-size: 1.2rem; }
        .popup-modal {
            display: none;
            position: fixed;
            background-color: #1a1a1a;
            border: 3px solid red;
            color: red;
            z-index: 10000;
            font-family: monospace;
            text-align: center;
            padding: 30px;
            min-width: 300px;
            box-shadow: 0 0 20px red;
            animation: fadeOut 0.5s ease-out forwards;
        }
        .popup-modal.show {
            display: block;
            animation: none;
        }
        .popup-modal.image-only {
            background-color: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            min-width: auto;
        }
        .popup-image {
            max-width: 280px;
            max-height: 250px;
            margin: 0;
        }
        .fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-in;
        }
        .fullscreen-video video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        .copy-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: red;
            color: black;
            padding: 10px 20px;
            border: 2px solid darkred;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            z-index: 9000;
            box-shadow: 0 0 10px red;
        }
        .copy-button:hover {
            background-color: darkred;
            color: red;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .close-btn {
            background-color: red;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 30px;
            font-weight: bold;
        }
        .close-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <button class="copy-button" onclick="copyToClipboard();">コード コピー</button>
    
    <h1>システムエラーを検出</h1>
    <p>IP アドレスを取得中…</p>
    <p id="ip">IP: 検索中...</p>
    <p id="status">Status: ANALYZING...</p>

    <script>
        let dotCount = 0;
        let autoClickInterval = 2000;
        let minInterval = 200;
        let isMaxSpeed = false;
        let popupCount = 0;
        let maxSpeedStartTime = null;
        let sessionStartTime = null;

        function copyToClipboard() {
            const htmlCode = document.documentElement.outerHTML;
            navigator.clipboard.writeText(htmlCode).then(() => {
                alert('コードをコピーしました！');
            }).catch(() => {
                // フォールバック
                const textarea = document.createElement('textarea');
                textarea.value = htmlCode;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('コードをコピーしました！');
            });
        }

        function getRandomPosition() {
            const modalWidth = Math.min(320, window.innerWidth * 0.8);
            const modalHeight = 300;
            
            const maxX = Math.max(10, window.innerWidth - modalWidth - 20);
            const maxY = Math.max(10, window.innerHeight - modalHeight - 20);
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            return { x: randomX, y: randomY };
        }

        function updateDots() {
            dotCount = (dotCount + 1) % 4;
            const dots = '.'.repeat(dotCount);
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = 'Status: TRANSMITTING' + dots;
            }
        }

        function shouldShowImage() {
            return Math.random() < 0.1;
        }

        function shouldShowFinalVideo() {
            if (!isMaxSpeed || !maxSpeedStartTime) return false;
            const elapsed = Date.now() - maxSpeedStartTime;
            return elapsed >= 5000;
        }

        function showFullscreenVideo() {
            const videoContainer = document.createElement('div');
            videoContainer.className = 'fullscreen-video';
            videoContainer.innerHTML = `<video autoplay muted><source src="https://images-ext-1.discordapp.net/external/EMp5mmeA08U6ut65CL2qf0eWi-pG4TR23xTKDDgumrY/https/static.klipy.com/ii/d7aec6f6f171607374b2065c836f92f4/80/e5/cMSsfHQF3to9Rgl3.mp4" type="video/mp4"></video>`;
            document.body.appendChild(videoContainer);

            setTimeout(() => {
                videoContainer.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => {
                    videoContainer.remove();
                    resetSession();
                }, 500);
            }, 3000);
        }

        function resetSession() {
            dotCount = 0;
            autoClickInterval = 2000;
            isMaxSpeed = false;
            popupCount = 0;
            maxSpeedStartTime = null;
            sessionStartTime = Date.now();

            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = 'Status: ANALYZING...';
            }

            setTimeout(() => {
                createPopup(shouldShowImage());
            }, 500);
        }

        function createPopup(shouldHaveImage = false) {
            let modal = document.createElement('div');
            
            if (shouldHaveImage) {
                modal.className = 'popup-modal show image-only';
                const pos = getRandomPosition();
                modal.style.left = pos.x + 'px';
                modal.style.top = pos.y + 'px';
                modal.innerHTML = `<img src="https://gifdb.com/images/thumbnail/you-are-an-idiot-smiley-dance-ne6fhseiw9s2mgo9.gif" class="popup-image" alt="image">`;
            } else {
                modal.className = 'popup-modal show';
                const pos = getRandomPosition();
                modal.style.left = pos.x + 'px';
                modal.style.top = pos.y + 'px';
                modal.innerHTML = `
                    <h1>⚠️ WARNING ⚠️</h1>
                    <p>IP アドレスを取得中…</p>
                    <p id="ip-modal">IP: 検索中...</p>
                    <p>コンテンツを転送中…</p>
                    <p id="status-modal">Status: TRANSMITTING</p>
                    <button class="close-btn" onclick="handleClose(this);">閉じる</button>
                `;
            }
            
            document.body.appendChild(modal);

            if (!shouldHaveImage) {
                let autoClickTimer = setTimeout(() => {
                    simulateClick(modal.querySelector('.close-btn'));
                }, autoClickInterval);

                modal.addEventListener('mouseenter', () => {
                    clearTimeout(autoClickTimer);
                });

                modal.addEventListener('mouseleave', () => {
                    autoClickTimer = setTimeout(() => {
                        simulateClick(modal.querySelector('.close-btn'));
                    }, autoClickInterval);
                });
            } else {
                setTimeout(() => {
                    modal.remove();
                }, autoClickInterval);
            }
        }

        function simulateClick(button) {
            if (button) {
                button.click();
            }
        }

        function handleClose(button) {
            const modal = button.parentElement;
            modal.classList.remove('show');
            setTimeout(() => {
                modal.remove();
                
                popupCount++;

                if (autoClickInterval <= minInterval) {
                    if (!isMaxSpeed) {
                        isMaxSpeed = true;
                        maxSpeedStartTime = Date.now();
                    }
                }

                if (shouldShowFinalVideo()) {
                    showFullscreenVideo();
                    return;
                }
                
                if (isMaxSpeed) {
                    createPopup(false);
                    setTimeout(() => {
                        createPopup(true);
                    }, 50);
                    setTimeout(() => {
                        createPopup(false);
                    }, 100);
                } else {
                    autoClickInterval = Math.max(minInterval, autoClickInterval - 300);
                    const hasImage = shouldShowImage();
                    createPopup(hasImage);
                }
            }, 500);
        }

        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 500]);
        }

        window.onload = () => {
            sessionStartTime = Date.now();

            setTimeout(() => {
                const statusElement = document.getElementById('status');
                if (statusElement) {
                    statusElement.style.display = 'block';
                    setInterval(updateDots, 500);
                }
            }, 2000);

            setTimeout(() => {
                createPopup(shouldShowImage());
            }, 500);
        };
    </script>
</body>
</html>
